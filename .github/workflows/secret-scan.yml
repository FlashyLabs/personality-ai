# Secret scanning, through the workflow flashy-infra publishes.
#
# One file, calling one shared definition, so a change to the scan reaches every
# repository on its next run rather than needing thirty pull requests.
#
# Added before this repository has much in it, deliberately. A guard put in
# place before the first line of code costs nothing; the same guard added after
# a credential is already committed is archaeology.
name: secret-scan

on:
  push:
  pull_request:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  secrets:
    uses: FlashyLabs/flashy-infra/.github/workflows/secret-scan-reusable.yml@main
